name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version
        id: version
        run: |
          $version = Select-String -Path build.gradle.kts -Pattern 'version\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          Write-Output "VERSION=$version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build fatJar
        run: .\gradlew.bat fatJar --console=plain --no-daemon

      - name: Download JRE (BellSoft Liberica 17, 64-bit)
        run: |
          $jreUrl = "https://github.com/bell-sw/Liberica/releases/download/17.0.20+10/bellsoft-jre17.0.20+10-windows-amd64-full.zip"
          $jreZip = "jre-full.zip"
          Invoke-WebRequest -Uri $jreUrl -OutFile $jreZip
          Expand-Archive $jreZip -DestinationPath .
          $jreDir = Get-ChildItem -Directory | Where-Object { $_.Name -match "^(jdk|jre)" } | Select-Object -First 1
          Rename-Item $jreDir.FullName jre-full
          Write-Output "JRE descargado en jre-full"

      - name: Build MSI with jpackage
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $iconArg = ""
          if (Test-Path "src\main\resources\icon.ico") {
            $iconArg = "--icon src/main/resources/icon.ico"
          }
          jpackage --type msi `
            --name PeluGestion `
            --app-version $version `
            --input build\libs `
            --main-jar "PeluGestion-$version-all.jar" `
            --runtime-image jre-full `
            --dest dist `
            --win-shortcut `
            --win-menu `
            --win-menu-group "PeluGestion" `
            --win-dir-chooser `
            --description "Gestion de clientes de peluqueria" `
            --vendor "PeluGestion" `
            $iconArg
          Write-Output "MSI generado"

      - name: Build portable ZIP
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $stage = "dist\portable\PeluGestion"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build\libs\PeluGestion-$version-all.jar" $stage
          Copy-Item "packaging\windows\PeluGestion.bat" $stage
          Copy-Item "packaging\windows\PeluGestion-diagnostico.bat" $stage
          Copy-Item "packaging\windows\LEEME.txt" $stage
          Copy-Item -Recurse "jre-full" "$stage\jre"
          Compress-Archive -Path $stage -DestinationPath "dist\PeluGestion-Windows-portable.zip" -Force
          Write-Output "ZIP portable generado"
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "PeluGestion v${{ steps.version.outputs.VERSION }}"
          body: |
            ## PeluGestion v${{ steps.version.outputs.VERSION }}

            ### Windows
            - **Instalador**: `PeluGestion-${{ steps.version.outputs.VERSION }}.msi` — doble clic, siguiente-siguiente, listo.
            - **Portable**: `PeluGestion-Windows-portable.zip` — descomprimir y ejecutar `PeluGestion.bat`.

            El programa incluye su propio Java, no necesita instalar nada mas.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
